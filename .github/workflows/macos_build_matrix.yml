name: 🍎 MacOS Builds

on:
  push:
    branches-ignore:
      - "l10n_master"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for the public Apple Silicon release"
        required: true
        type: string

jobs:
  build_macos_qt:
    name: "Defaults"
    if: github.event_name != 'workflow_dispatch' && (github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request')
    uses: ./.github/workflows/macos_build.yml
    with:
      jobName: "MacOS Build"
      artifactPrefixName: "PCSX2-macos-Qt"
      sign_and_notarize: true # If we find that notarization takes a long time we should disable that on PR builds
    secrets: inherit
  build_macos_qt_arm:
    name: "arm64"
    if: github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request'
    uses: ./.github/workflows/macos_build.yml
    with:
      jobName: "MacOS arm64 Build"
      artifactPrefixName: "PCSX2-macos-Qt-arm64"
      arch: arm64
      package_arm64: ${{ github.repository == 'solid1353/PCSX2' && github.event_name != 'pull_request' }}
      sign_and_notarize: false
    secrets: inherit

  publish_macos_arm64:
    name: Publish macOS arm64 release
    if: github.repository == 'solid1353/PCSX2' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/extended-functionality'
    needs: build_macos_qt_arm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PCSX2-macos-arm64
      - name: Publish ZIP on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          gh release create --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PCSX2 for macOS arm64 ($RELEASE_TAG)" \
            --notes "Apple Silicon build with PINE on TCP loopback. This build is not notarized." \
            -- "$RELEASE_TAG" PCSX2-macos-arm64.zip
